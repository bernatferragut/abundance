name: Update signal

on:
  schedule:
    # Saturday 02:00 UTC = Friday ~22:00 ET, after the US close.
    - cron: "0 2 * * 6"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compute signal
        run: node scripts/signal.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- state.json; then
            echo "No change to state.json"
            exit 0
          fi
          git config user.name  "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add state.json
          git commit -m "signal: $(date -u +%Y-%m-%d)"
          git push
